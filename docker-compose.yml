version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smart-platform-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - smart-platform-network

  redis:
    image: redis:7.2-alpine
    container_name: smart-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-platform-network

  cassandra:
    image: cassandra:4.1
    container_name: smart-platform-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: SmartPlatformCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - smart-platform-network
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5

  neo4j:
    image: neo4j:5.14
    container_name: smart-platform-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    networks:
      - smart-platform-network

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: smart-platform-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - smart-platform-network

volumes:
  mongodb_data:
  redis_data:
  cassandra_data:
  neo4j_data:
  elasticsearch_data:

networks:
  smart-platform-network:
    driver: bridge
